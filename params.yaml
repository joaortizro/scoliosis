data:
  raw_dir: data/raw
  processed_dir: data/processed
  clean_index: data/processed/audit_v2_corrected/clean_index.csv
  test_holdout: data/processed/audit_v2_corrected/test_holdout.csv
  val_frac: 0.2
  cv_folds: 5
  random_seed: 42

train:
  encoder_name: resnet34
  pretrained: true
  dropout: 0.2
  batch_size: 4
  epochs: 100
  lr_enc: 1.0e-4
  lr_dec: 1.0e-3
  weight_decay: 2.0e-4
  optimizer: adamw          # adam | adamw
  freeze_encoder_epochs: 10
  augment: v4
  early_stop:
    patience: 20
    min_delta: 0.0
  ema:
    enabled: true
    decay: 0.999
  preprocess:
    clahe_mode: "off"        # "off" | "real"
    normalization: div255    # div255 | txrv
    roi_crop: "off"          # "off" | "from_mask" | "from_yolo"
  loss:
    boundary_lambda: 0.0   # set to 0.05/0.1/0.2 to enable SDHL boundary loss
  cutmix:
    enabled: false           # Phase 1.3a flips this to true
    prob: 0.5                # per-batch probability of applying CutMix
    rect_frac_range: [0.1, 0.4]  # uniform over this range for rect side as fraction of (H, W)
  aug:
    random_vertical_crop:    # Partial-FOV experiment (set augment=v4_vcrop_{gentle,aggressive})
      enabled: false         # informational; wiring is via the train.augment registry name
      p: 0.5                 # per-image probability when augment is a vcrop variant
      f_min: 0.5             # M1a (gentle)=0.5, M1b (aggressive)=0.3
      f_max: 1.0
      mode: random           # train-time mode: random | top | bottom | mid
  eval_partial_fov:
    coverage_fractions: [1.0, 0.8, 0.6, 0.5, 0.4, 0.3, 0.2]
    modes: [top, bottom, mid, random]
    random_seed: 42          # seed for the deterministic-but-random mode at eval

evaluate:
  metrics_path: experiments/results/metrics.json

mlflow:
  experiment_name: scoliosis-detection
  tracking_uri: http://localhost:5000
