stages:
  preprocess:
    cmd: python scripts/preprocess.py
    deps:
      - data/raw
      - ai/preprocessing/pipeline.py
    params:
      - params.yaml:
          - data

  train:
    cmd: python scripts/train.py
    deps:
      - data/processed/audit_v2_corrected/clean_index.csv
      - data/processed/audit_v2_corrected/test_holdout.csv
      - ai/training/
      - ai/models/architectures/
      - ai/preprocessing/segmentation.py
      - ai/preprocessing/keypoints.py
      - ai/evaluation/seg_metrics.py
      - ai/utils/
      - scripts/train.py
    params:
      - params.yaml:
          - data
          - train

  evaluate:
    cmd: python scripts/evaluate.py
    deps:
      - data/processed/audit_v2_corrected/clean_index.csv
      - data/processed/audit_v2_corrected/test_holdout.csv
      - ai/models/checkpoints
      - ai/evaluation/
      - ai/inference/
      - ai/training/splits.py
      - scripts/evaluate.py
    params:
      - params.yaml:
          - data
          - evaluate
    metrics:
      - experiments/results/metrics.json:
          cache: false
